<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Test email sender | i-Pet Cyber Store 2096</title>
  <style>
    :root{color-scheme:dark;--bg:#170c2b;--panel:#21123b;--line:#4b2d78;--ink:#f6f1ff;--soft:#c9b8ea;--pink:#ff3fb4;--cyan:#33ffe0;--gold:#ffd23f;--shadow:#120820}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,rgba(51,255,224,.12),transparent 45%),var(--bg);color:var(--ink);font:17px/1.5 Fredoka,"Trebuchet MS",system-ui,sans-serif}
    main{width:min(100%,620px);padding:clamp(22px,5vw,42px);border:3px solid var(--cyan);border-radius:20px;background:linear-gradient(145deg,var(--panel),var(--bg));box-shadow:0 0 0 5px var(--shadow),0 0 42px rgba(51,255,224,.14)}
    .eyebrow{margin:0 0 8px;color:var(--cyan);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
    h1{margin:0;color:var(--pink);font-size:clamp(32px,7vw,48px);line-height:1.05}
    p{color:var(--soft)}
    form{display:grid;gap:16px;margin-top:26px}
    label{display:grid;gap:7px;font-weight:600}
    input{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#10091c;color:var(--ink);font:inherit}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    button,.back{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border:2px solid var(--shadow);border-radius:12px;background:var(--cyan);color:var(--shadow);font:700 17px Fredoka,"Trebuchet MS",sans-serif;text-decoration:none;box-shadow:3px 4px 0 var(--shadow);cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #result{min-height:1.5em;margin:0;color:var(--cyan)}
    #result.error{color:#ff7899}
    .back{margin-top:20px;background:transparent;border-color:var(--line);color:var(--ink);box-shadow:none}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Server tools</p>
    <h1>Test email sender</h1>
    <p>Sends one fixed test message to the recipient configured by the server administrator. The access key is used only for this request and is not saved in this browser.</p>
    <form id="test-form">
      <label for="access-key">Test sender access key
        <input id="access-key" name="token" type="password" autocomplete="off" minlength="32" required>
      </label>
      <button id="send-button" type="submit">Send test email</button>
      <p id="result" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="/">Back to the website</a>
  </main>
  <script>
    const form = document.getElementById("test-form");
    const button = document.getElementById("send-button");
    const result = document.getElementById("result");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      result.classList.remove("error");
      result.textContent = "Sending test message…";
      try {
        const response = await fetch("/api/test-email", {
          method: "POST",
          credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token: form.elements.token.value })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "The test email could not be sent.");
        result.textContent = body.message || "Test email accepted by the server.";
        form.reset();
      } catch (error) {
        result.classList.add("error");
        result.textContent = error.message || "The test email could not be sent.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
